<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王清越 | 個人網頁</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@400;600&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            /* Deep navy/black background */
            background-color: #050b14; 
        }
        
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        /* Subtle glowing accent for the dark theme */
        .glow-effect {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .hover-glow:hover {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="text-slate-300 antialiased selection:bg-sky-500/30 selection:text-sky-200">

    <!-- Background Decoration -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-sky-900/20 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-900/20 blur-[120px]"></div>
    </div>

    <!-- Container -->
    <div class="min-h-screen flex flex-col items-center justify-center py-16 px-6 sm:px-12">
        
        <div class="w-full max-w-4xl space-y-12">
            
            <!-- Hero / Profile Section -->
            <header class="text-center space-y-6">
                <!-- Avatar / Icon -->
                <div class="relative inline-flex items-center justify-center w-32 h-32 rounded-full bg-slate-900/80 border border-sky-500/30 glow-effect backdrop-blur-sm mb-2 group">
                    <div class="absolute inset-0 rounded-full border border-sky-400 opacity-0 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500"></div>
                    <i class="fa-solid fa-terminal text-4xl text-sky-400"></i>
                </div>
                
                <!-- Name & Title -->
                <div>
                    <h1 class="text-5xl font-bold text-white tracking-wide mb-3">王清越</h1>
                    <div class="flex items-center justify-center gap-3 text-lg">
                        <span class="text-sky-400 font-medium bg-sky-400/10 px-4 py-1.5 rounded-full border border-sky-400/20">數位多媒體</span>
                        <span class="text-slate-500">|</span>
                        <span class="text-slate-400 font-poppins text-sm tracking-widest uppercase">Digital Multimedia</span>
                    </div>
                </div>

                <!-- One-line Intro -->
                <div class="max-w-2xl mx-auto bg-slate-900/50 border border-slate-800 rounded-2xl p-6 relative mt-6 backdrop-blur-sm hover:border-sky-500/30 transition-colors duration-300">
                    <i class="fa-solid fa-quote-left absolute top-4 left-4 text-slate-700/50 text-2xl"></i>
                    <p class="text-xl text-slate-200 leading-relaxed font-medium relative z-10 px-8 py-2">
                        您好，我是清越，我对写代码很感兴趣。
                    </p>
                    <i class="fa-solid fa-quote-right absolute bottom-4 right-4 text-slate-700/50 text-2xl"></i>
                </div>
            </header>

            <!-- Main Content (Grid) -->
            <main class="grid md:grid-cols-2 gap-6">
                
                <!-- Interests Card -->
                <div class="bg-slate-900/60 border border-slate-800 p-8 rounded-2xl hover:border-sky-500/40 hover:-translate-y-1 transition-all duration-300 hover-glow backdrop-blur-sm group">
                    <div class="w-14 h-14 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-sky-400 mb-6 group-hover:bg-sky-500/10 group-hover:text-sky-300 transition-colors">
                        <i class="fa-solid fa-heart fa-xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-4 flex items-center gap-2">
                        我的興趣
                        <span class="w-8 h-1 bg-sky-500/50 rounded-full block mt-1"></span>
                    </h3>
                    <p class="text-slate-400 leading-relaxed text-lg">
                        我对写代码很感兴趣，想学习更多关于编程的知识。
                    </p>
                </div>

                <!-- Goals Card -->
                <div class="bg-slate-900/60 border border-slate-800 p-8 rounded-2xl hover:border-blue-500/40 hover:-translate-y-1 transition-all duration-300 hover-glow backdrop-blur-sm group">
                    <div class="w-14 h-14 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-blue-400 mb-6 group-hover:bg-blue-500/10 group-hover:text-blue-300 transition-colors">
                        <i class="fa-solid fa-gamepad fa-xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-4 flex items-center gap-2">
                        技能 / 學習目標
                        <span class="w-8 h-1 bg-blue-500/50 rounded-full block mt-1"></span>
                    </h3>
                    <p class="text-slate-400 leading-relaxed text-lg">
                        我的目标是学会写代码，然后自己开发一款游戏。
                    </p>
                </div>

            </main>

            <!-- Contact Section -->
            <footer class="pt-8 mt-8 border-t border-slate-800/50">
                <div class="text-center mb-8">
                    <h3 class="text-xl font-medium text-slate-400 uppercase tracking-widest font-poppins">Contact Me</h3>
                </div>
                
                <div class="flex flex-col sm:flex-row justify-center gap-6">
                    <!-- Email -->
                    <a href="mailto:tor000op5@gmail.com" class="flex items-center gap-4 bg-slate-900/80 border border-slate-800 px-6 py-4 rounded-xl hover:border-sky-500/50 hover:bg-slate-800 transition-all duration-300 group hover-glow">
                        <div class="w-12 h-12 rounded-full bg-slate-950 flex items-center justify-center text-sky-400 group-hover:scale-110 transition-transform">
                            <i class="fa-regular fa-envelope fa-lg"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 font-poppins">Email</p>
                            <p class="font-medium text-slate-200">tor000op5@gmail.com</p>
                        </div>
                    </a>

                    <!-- Line -->
                    <div class="flex items-center gap-4 bg-slate-900/80 border border-slate-800 px-6 py-4 rounded-xl hover:border-green-500/40 hover:bg-slate-800 transition-all duration-300 group hover:shadow-[0_0_25px_rgba(34,197,94,0.15)] cursor-default">
                        <div class="w-12 h-12 rounded-full bg-slate-950 flex items-center justify-center text-green-400 group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-line fa-xl"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1 font-poppins">Line ID</p>
                            <p class="font-medium text-slate-200">thanaphat_3112</p>
                        </div>
                    </div>
                </div>
            </footer>

        </div>
    </div>

</body>
</html>
